name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # the report is deployed as a Pages artifact, so nothing writes to the repo
  checks: write # test-reporter's check run
  pull-requests: write # test summary comment
  # pages/id-token write are scoped to the deploy job rather than granted workflow-wide.

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AUTOMATION_ENVIRONMENT: Ci
  TEST_OUTPUT_DIR: src/JuiceShop.Automation.Execution/bin/Release/net10.0

jobs:
  test:
    name: UI end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      # Gates the deploy job: 'skipped' when there were no results to build a report from.
      report: ${{ steps.allure.outcome }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start OWASP Juice Shop
        # --wait blocks on the compose healthcheck. The image ships none of its own and takes
        # 20-60s to seed, so without it the first fixture races a still-starting app.
        run: docker compose up -d --wait --wait-timeout 240

      - name: Build
        id: build
        run: dotnet build -c Release

      # Browsers are cached against the Playwright version. The install itself is driven from the test run, so no PowerShell is required here either.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.0

      - name: Run tests
        id: tests
        # -c Release --no-build ensures no silent rebuilds in debug
        run: >
          dotnet test -c Release --no-build
          --settings .runsettings
          --results-directory "${{ github.workspace }}/artifacts/test-results"
          --logger "trx;LogFileName=test-results.trx"

      - name: Juice Shop logs
        if: failure()
        run: docker compose logs --no-color juice-shop

      # Reporting tail. Each step is gated on the artifact it consumes, so it goes grey rather than
      # red when there is nothing to report. `!cancelled()` not `always()`: a superseded run must
      # not half-publish Pages. The ${{ }} wrapper is mandatory on an `if:` starting with `!`.

      # Not gated on tests passing — a red run is when the trace is wanted.
      - name: Upload failure artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ${{ env.TEST_OUTPUT_DIR }}/artifacts/traces/
            ${{ env.TEST_OUTPUT_DIR }}/artifacts/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish test results
        if: ${{ !cancelled() && hashFiles('artifacts/test-results/*.trx') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: NUnit results
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      # ---- Allure report on GitHub Pages -------------------------------------------------
      # Requires Settings -> Pages -> Source = "GitHub Actions". The report is deployed as a Pages
      # artifact, so there is no gh-pages branch and nothing is ever pushed to the repository.
      #
      # Deliberately NOT a checkout of a publish branch. `actions/checkout` runs `git init` before
      # it fetches, so a checkout of a not-yet-existing ref leaves a .git behind whose HEAD is
      # refs/heads/master; the report action below runs as root in its container and copies that
      # directory wholesale (`cp -r src/. dst`, dotfiles included) into its output, which used to
      # poison the branch-publishing step.

      # A Pages deployment replaces the whole site, so the previous site is the only carrier of the
      # run archive and the trend history. It round-trips through the cache instead of a branch. The
      # run-scoped key can never hit; restore-keys picks up the newest previous entry.
      - name: Restore previous report history
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: allure-history-prev
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Build Allure report
        id: allure
        # `allure generate` fails outright on a missing directory, and this action does not guard it.
        if: ${{ !cancelled() && hashFiles(format('{0}/allure-results/*-result.json', env.TEST_OUTPUT_DIR)) != '' }}
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: ${{ env.TEST_OUTPUT_DIR }}/allure-results
          gh_pages: allure-history-prev
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # Tars allure-history as the 'github-pages' artifact; the deploy job turns it into the site.
      - name: Upload Pages artifact
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.allure.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-history

      # Has to be a copy to a second path: the report action copies gh_pages INTO allure_history, and
      # pointing both at one directory would make that a self-copy. allure-history is root-owned
      # (Docker action), which is fine — it is only ever read from here.
      - name: Stage this run's site as the next run's history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.allure.outcome == 'success' }}
        run: rm -rf allure-history-prev && cp -r allure-history allure-history-prev

      - name: Save report history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.allure.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: allure-history-prev
          key: allure-history-${{ github.run_id }}

  # Separate job so that pages/id-token write and the github-pages environment stay off the job that
  # runs the tests and the SUT.
  deploy:
    name: Publish Allure report
    # No success(): a red suite is exactly when the report is wanted, and `needs` without success()
    # still runs after a failed suite. !cancelled() keeps a superseded run from half-publishing.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.outputs.report == 'success' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC token deploy-pages proves the deployment's origin with

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Not the workflow's e2e group: two Pages deployments must not overlap, and cancelling one
    # mid-flight can leave the deployment wedged.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lint:
    name: Format and analysers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Asks the inverse of the obvious check: of the files that ARE committed, would .gitignore
      # have excluded any? (An ignored file is absent after checkout, so the obvious check passes
      # vacuously.) Neither flag is optional — `core.ignorecase=true` because the bug only
      # reproduces on a case-insensitive clone, `--no-index` because check-ignore skips tracked
      # paths without it, and every path here is tracked.
      - name: Guard against .gitignore shadowing committed source
        shell: bash
        run: |
          # check-ignore exits 1 when nothing matches, which is the success case under -eo pipefail.
          shadowed=$(git ls-files -- 'src/*' '.github/*' \
            | git -c core.ignorecase=true check-ignore --no-index --stdin --verbose || true)
          if [ -n "$shadowed" ]; then
            echo "::error::.gitignore matches files that are committed. On a case-insensitive"
            echo "::error::filesystem these can be dropped from a clone and CI will fail to build."
            echo "::error::Anchor the offending pattern with a leading slash."
            echo "$shadowed"
            exit 1
          fi
          echo "No committed source file is matched by .gitignore."

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Complementary: format catches whitespace and using-order drift, the build catches analyser
      # violations (errors here, via TreatWarningsAsErrors).
      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn

      - name: Build with analysers
        run: dotnet build -c Release

      # Deliberately in the job with NO container. One eager await in AutomationRuntime.StartAsync
      # would recouple these rules to Docker, and that regression is invisible where the SUT is up.
      - name: Architecture rules
        run: dotnet test -c Release --no-build --filter "TestCategory=Architecture"
